# Khmis Sanad in Docker.
#
# First-time setup is in the root README, section "Getting started with Docker".
# After that, start the project with:
#   docker compose up
#
#   db   — MySQL                 127.0.0.1:3307
#   app  — Laravel API           http://localhost:8000
#   web  — React site            http://localhost:5173
#
# Stop:  docker compose down
# Stop and delete the database:  docker compose down -v

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: marketplace
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      # 3307 on your PC, so this does not fight XAMPP (which already uses 3306).
      # Inside Docker the API still talks to this database on port 3306.
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Your Backend folder is visible inside the container, so code edits apply live.
      - ./Backend:/var/www/html
      # PHP dependencies stay in Docker, not mixed with a Windows vendor folder.
      - app_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: marketplace
      DB_USERNAME: marketplace
      DB_PASSWORD: secret
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Emails are written to Backend/storage/logs/laravel.log
      MAIL_MAILER: log
      # Run jobs immediately, so you do not need a second worker process.
      QUEUE_CONNECTION: sync
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Your frontend folder is visible inside the container, so code edits apply live.
      - ./frontend:/app
      # npm packages stay in Docker, not mixed with a Windows node_modules folder.
      - web_node_modules:/app/node_modules
    environment:
      # The browser on your PC calls the API. It is not a call from inside Docker.
      VITE_API_URL: http://localhost:8000
      # Docker on Windows does not see file saves unless the watcher polls.
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - app

volumes:
  db_data:
  app_vendor:
  web_node_modules:
