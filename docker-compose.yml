version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: khmissa_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
    volumes:
      - ./Backend:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    networks:
      - khmissa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khmissa_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000/api
    networks:
      - khmissa-network

networks:
  khmissa-network:
    driver: bridge